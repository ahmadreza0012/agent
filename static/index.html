<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Bot Dashboard</title>
    <meta name="description" content="نظارت بلادرنگ بر ۶۰ قابلیت ربات معاملاتی کریپتو همراه با تحلیل هوشمند و لاگ‌های اختصاصی">
    <meta property="og:title" content="Crypto Trading Bot Dashboard">
    <meta property="og:description" content="نظارت بلادرنگ بر ۶۰ قابلیت ربات معاملاتی کریپتو همراه با تحلیل هوشمند و لاگ‌های اختصاصی">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #0f3460;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.2);
        }
        
        .card-number {
            font-size: 3rem;
            font-weight: bold;
            color: #e94560;
        }
        
        .card-label {
            color: #a0a0a0;
            margin-top: 10px;
            font-size: 1rem;
        }
        
        .category-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .category-title {
            font-size: 1.5rem;
            color: #00d9ff;
        }
        
        .capabilities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 15px;
        }
        
        .capability-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border-right: 4px solid #a0a0a0;
            transition: all 0.3s ease;
        }
        
        .capability-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(-5px);
        }
        
        .capability-item.healthy {
            border-right-color: #00ff88;
        }
        
        .capability-item.degraded {
            border-right-color: #ffaa00;
        }
        
        .capability-item.failing {
            border-right-color: #ff4444;
        }
        
        .capability-item.unknown {
            border-right-color: #a0a0a0;
        }
        
        .capability-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .capability-stats {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 10px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat.success { color: #00ff88; }
        .stat.warning { color: #ffaa00; }
        .stat.error { color: #ff4444; }
        
        .capability-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .btn-primary {
            background: #e94560;
            color: white;
        }
        
        .btn-primary:hover {
            background: #ff6b6b;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-title {
            font-size: 1.5rem;
            color: #e94560;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: #a0a0a0;
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .close-btn:hover {
            color: #fff;
        }
        
        .log-entry {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-right: 3px solid #a0a0a0;
        }
        
        .log-entry.success { border-right-color: #00ff88; }
        .log-entry.warning { border-right-color: #ffaa00; }
        .log-entry.error { border-right-color: #ff4444; }
        
        .log-timestamp {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 5px;
        }
        
        .log-message {
            color: #fff;
            margin-bottom: 10px;
        }
        
        .llm-analysis {
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid rgba(0, 217, 255, 0.3);
        }
        
        .analysis-title {
            color: #00d9ff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .analysis-content {
            color: #a0a0a0;
            line-height: 1.6;
        }
        
        .risk-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .risk-low { background: #00ff88; color: #000; }
        .risk-medium { background: #ffaa00; color: #000; }
        .risk-high { background: #ff4444; color: #fff; }
        .risk-critical { background: #990000; color: #fff; }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #a0a0a0;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #e94560;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e94560;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(233, 69, 96, 0.6);
        }
        
        .last-update {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #3b82f6;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 0.95rem;
            direction: rtl;
            transition: all 0.3s ease;
        }
        .toast.success { border-color: #10b981; background: #064e3b; }
        .toast.info { border-color: #00d9ff; background: #082f49; }
        .toast.error { border-color: #ef4444; background: #7f1d1d; }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    <div class="container">
        <header>
            <h1>🎯 داشبورد قابلیت‌های سیستم ترید</h1>
            <p class="subtitle">نظارت بلادرنگ بر ۶۰ قابلیت سیستم با تحلیل هوش مصنوعی</p>
            <div style="margin-top: 20px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="simulateActivity()" style="font-size: 1rem; padding: 12px 24px;">
                    🎲 شبیه‌سازی فعالیت
                </button>
                <button class="btn btn-secondary" onclick="copyAllLogsAndAnalysis()" style="font-size: 1rem; padding: 12px 24px;">
                    📋 کپی تمام لاگ‌ها و تحلیل‌های LLM
                </button>
                <a href="/api/v1/capabilities/export-text" download="trading_system_report.txt" class="btn" style="background: #10b981; color: #fff; text-decoration: none; font-size: 1rem; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px;">
                    💾 دانلود گزارش متنی (.txt)
                </a>
            </div>
        </header>
        
        <div id="summary" class="summary-cards">
            <div class="card">
                <div class="card-number" id="total-capabilities">-</div>
                <div class="card-label">کل قابلیت‌ها</div>
            </div>
            <div class="card">
                <div class="card-number" id="healthy-count" style="color: #00ff88;">-</div>
                <div class="card-label">سالم</div>
            </div>
            <div class="card">
                <div class="card-number" id="degraded-count" style="color: #ffaa00;">-</div>
                <div class="card-label">کاهشی</div>
            </div>
            <div class="card">
                <div class="card-number" id="failing-count" style="color: #ff4444;">-</div>
                <div class="card-label">ناموفق</div>
            </div>
        </div>
        
        <div id="categories-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>در حال بارگذاری...</p>
            </div>
        </div>
        
        <p class="last-update" id="last-update"></p>
    </div>
    
    <button class="refresh-btn" onclick="loadDashboard()" title="بارگذاری مجدد">🔄</button>
    
    <!-- Modal for Logs -->
    <div class="modal-overlay" id="logs-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">لاگ‌ها</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        
        function showToast(message, type = 'info', duration = 3500) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
        
        const categoryNames = {
            'core_trading': 'معامله‌گری اصلی',
            'risk_management': 'مدیریت ریسک',
            'order_management': 'مدیریت سفارش',
            'backtesting_quant': 'بک‌تست و کوانت',
            'ai_ml': 'هوش مصنوعی و یادگیری ماشین',
            'ai_sentiment': 'تحلیل احساسات',
            'infrastructure': 'زیرساخت'
        };
        
        const capabilityNames = {
            'algorithmic_crypto_trading': 'ترید الگوریتمی کریپتو',
            'multi_exchange_support': 'پشتیبانی چند صرافی',
            'market_data_fetching': 'دریافت داده بازار',
            'multi_timeframe_analysis': 'تحلیل چند تایم‌فریمی',
            'technical_strategies': 'استراتژی‌های تکنیکال',
            'market_regime_detection': 'تشخیص Market Regime',
            'ensemble_strategies': 'ترکیب چند استراتژی',
            'portfolio_optimization': 'بهینه‌سازی پورتفولیو',
            'risk_management': 'مدیریت ریسک',
            'position_sizing': 'تعیین اندازه پوزیشن',
            'stop_loss_take_profit': 'Stop Loss / Take Profit',
            'trailing_stop': 'Trailing Stop',
            'breakeven_stop': 'Breakeven',
            'partial_take_profit': 'Partial Take Profit',
            'max_positions_exposure': 'حداکثر پوزیشن و Exposure',
            'circuit_breaker': 'Circuit Breaker',
            'kill_switch': 'Kill Switch',
            'live_safety_engine': 'Live Safety Engine',
            'order_manager': 'Order Manager',
            'idempotency': 'Idempotency',
            'fill_manager': 'Fill Manager',
            'position_manager': 'Position Manager',
            'exchange_reconciliation': 'Exchange Reconciliation',
            'crash_recovery': 'Crash Recovery',
            'persistence_database': 'Persistence / Database',
            'walk_forward_backtesting': 'Walk-Forward Backtesting',
            'out_of_sample_testing': 'Out-of-Sample Testing',
            'transaction_cost_modeling': 'Transaction Cost Modeling',
            'slippage_modeling': 'Slippage Modeling',
            'no_trade_zone': 'No-Trade Zone',
            'benchmarking': 'Benchmarking',
            'ensemble_backtesting': 'Ensemble Backtesting',
            'performance_metrics': 'Performance Metrics',
            'regime_based_analysis': 'Regime-based Analysis',
            'monte_carlo_robustness': 'Monte Carlo / Robustness',
            'ml_pipeline': 'ML Pipeline',
            'feature_engineering': 'Feature Engineering',
            'causal_feature_engineering': 'Causal Feature Engineering',
            'purged_walk_forward_validation': 'Purged Walk-Forward Validation',
            'ml_prediction': 'ML Prediction',
            'model_registry': 'Model Registry',
            'model_versioning': 'مدیریت نسخه مدل',
            'model_drift_monitoring': 'Model Drift Monitoring',
            'ml_strategy_integration': 'ترکیب ML با استراتژی',
            'sentiment_analysis': 'Sentiment Analysis',
            'news_context_analysis': 'News/Context Analysis',
            'llm_integration': 'LLM Integration',
            'sentiment_as_signal': 'Sentiment به‌عنوان سیگنال',
            'fastapi': 'FastAPI',
            'trading_api': 'Trading API',
            'health_status_monitoring': 'Health / Status Monitoring',
            'logging': 'Logging',
            'observability': 'Observability',
            'configuration_management': 'Configuration Management',
            'sqlite_postgresql': 'SQLite/PostgreSQL',
            'docker_deployment': 'Docker/Deployment',
            'ci_cd_support': 'CI/CD Support',
            'paper_trading': 'Paper Trading',
            'shadow_trading': 'Shadow Trading',
            'live_trading_architecture': 'Live Trading Architecture'
        };

        let isDashboardLoading = false;
        async function loadDashboard(retryCount = 0) {
            if (isDashboardLoading && retryCount === 0) return;
            isDashboardLoading = true;
            try {
                const response = await fetch(`${API_BASE}/data`, {
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error(`پاسخ سرور نامعتبر بود (${response.status})`);
                }
                const data = await response.json();
                
                // Update summary cards - adapt to new API structure
                document.getElementById('total-capabilities').textContent = data.metrics ? data.metrics.total_capabilities : 60;
                
                // Calculate status counts from capabilities_status
                let healthyCount = 0, degradedCount = 0, failingCount = 0;
                if (data.capabilities_status) {
                    for (const capId in data.capabilities_status) {
                        const cap = data.capabilities_status[capId];
                        if (cap.status === 'active' || cap.status === 'healthy') healthyCount++;
                        else if (cap.status === 'warning') degradedCount++;
                        else if (cap.status === 'error' || cap.status === 'failing') failingCount++;
                    }
                }
                
                document.getElementById('healthy-count').textContent = healthyCount;
                document.getElementById('degraded-count').textContent = degradedCount;
                document.getElementById('failing-count').textContent = failingCount;
                
                // Render categories using the structure
                if (data.capabilities_structure && data.capabilities_status) {
                    renderCategoriesNew(data.capabilities_structure, data.capabilities_status);
                }
                
                // Update timestamp
                document.getElementById('last-update').textContent = 
                    `آخرین بروزرسانی: ${new Date().toLocaleString('fa-IR')}`;
                isDashboardLoading = false;
                    
            } catch (error) {
                console.warn(`Error loading dashboard (attempt ${retryCount + 1}):`, error.message);
                if (retryCount < 3) {
                    // Auto-retry with backoff for iframe initialization
                    setTimeout(() => loadDashboard(retryCount + 1), (retryCount + 1) * 1200);
                    return;
                }
                isDashboardLoading = false;
                document.getElementById('categories-container').innerHTML = `
                    <div class="loading" style="padding: 30px; text-align: center;">
                        <p style="color: #ff4444; font-size: 1.05rem; margin-bottom: 12px;">⚠️ خطا در بارگذاری اطلاعات داشبورد: ${error.message}</p>
                        <button onclick="loadDashboard(0)" class="btn" style="background: #e94560; color: #fff; padding: 10px 24px; border-radius: 6px; cursor: pointer;">
                            🔄 تلاش مجدد
                        </button>
                    </div>
                `;
            }
        }
        
        function renderCategoriesNew(capabilitiesStructure, capabilitiesStatus) {
            const container = document.getElementById('categories-container');
            let html = '';
            
            for (const [categoryKey, categoryData] of Object.entries(capabilitiesStructure)) {
                const categoryName = categoryData.name || categoryKey;
                const caps = categoryData.capabilities || [];
                
                // Count healthy capabilities
                let healthyCount = 0;
                caps.forEach(cap => {
                    const capStatus = capabilitiesStatus[cap.id]?.status || 'unknown';
                    if (capStatus === 'active' || capStatus === 'healthy') healthyCount++;
                });
                
                html += `
                    <div class="category-section">
                        <div class="category-header">
                            <h3 class="category-title">${categoryName}</h3>
                            <span style="color: #a0a0a0;">${healthyCount}/${caps.length} سالم</span>
                        </div>
                        <div class="capabilities-grid">
                `;
                
                caps.forEach(cap => {
                    const capId = cap.id;
                    const capName = cap.name || capId;
                    const capInfo = capabilitiesStatus[capId] || {};
                    const capStatus = capInfo.status || 'unknown';
                    const logs = capInfo.logs || [];
                    
                    // Count log types
                    let successCount = 0, warningCount = 0, errorCount = 0;
                    logs.forEach(log => {
                        if (log.event_type === 'success') successCount++;
                        else if (log.event_type === 'warning') warningCount++;
                        else if (log.event_type === 'error') errorCount++;
                    });
                    
                    // Map status to CSS class
                    let statusClass = 'unknown';
                    if (capStatus === 'active' || capStatus === 'healthy') statusClass = 'healthy';
                    else if (capStatus === 'warning') statusClass = 'degraded';
                    else if (capStatus === 'error' || capStatus === 'failing') statusClass = 'failing';
                    
                    html += `
                        <div class="capability-item ${statusClass}">
                            <div class="capability-name">${capName}</div>
                            <div class="capability-stats">
                                <span class="stat success">✓ ${successCount}</span>
                                <span class="stat warning">⚠ ${warningCount}</span>
                                <span class="stat error">✗ ${errorCount}</span>
                            </div>
                            <div class="capability-actions">
                                <button class="btn btn-primary" onclick="showLogs('${capId}')">📋 لاگ‌ها</button>
                                <button class="btn btn-secondary" onclick="showAnalysis('${capId}')">🤖 تحلیل LLM</button>
                                <button class="btn btn-secondary" onclick="triggerLog('${capId}')">📝 ثبت لاگ تست</button>
                            </div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        async function showLogs(capability) {
            const modal = document.getElementById('logs-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            
            title.textContent = capabilityNames[capability] || capability;
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال بارگذاری...</p></div>';
            modal.classList.add('active');
            
            try {
                const response = await fetch(`${API_BASE}/capability/${capability}/logs?limit=20`);
                const logs = await response.json();
                
                if (logs.length === 0) {
                    content.innerHTML = '<p style="text-align: center; color: #a0a0a0;">هیچ لاگی ثبت نشده است</p>';
                    return;
                }
                
                let html = '';
                logs.reverse().forEach(log => {
                    html += `
                        <div class="log-entry ${log.status}">
                            <div class="log-timestamp">${new Date(log.timestamp).toLocaleString('fa-IR')}</div>
                            <div class="log-message">${log.message}</div>
                            ${log.data ? `<pre style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; font-size: 0.8rem;">${JSON.stringify(log.data, null, 2)}</pre>` : ''}
                        </div>
                    `;
                });
                
                content.innerHTML = html;
                
            } catch (error) {
                content.innerHTML = '<p style="color: #ff4444;">خطا در بارگذاری لاگ‌ها</p>';
            }
        }
        
        async function showAnalysis(capability) {
            const modal = document.getElementById('logs-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            
            title.textContent = `تحلیل LLM - ${capabilityNames[capability] || capability}`;
            content.innerHTML = '<div class="loading"><div class="spinner"></div><p>در حال دریافت تحلیل...</p></div>';
            modal.classList.add('active');
            
            try {
                const response = await fetch(`${API_BASE}/capability/${capability}/analysis`);
                const analysis = await response.json();
                
                if (!analysis) {
                    content.innerHTML = '<p style="text-align: center; color: #a0a0a0;">هنوز تحلیلی موجود نیست. ابتدا لاگ ثبت کنید.</p>';
                    return;
                }
                
                const riskClass = `risk-${analysis.risk_level}`;
                const riskLabels = {
                    'low': 'کم',
                    'medium': 'متوسط',
                    'high': 'بالا',
                    'critical': 'بحرانی'
                };
                
                content.innerHTML = `
                    <div class="llm-analysis">
                        <div class="analysis-title">📊 تحلیل</div>
                        <div class="analysis-content">${analysis.analysis}</div>
                    </div>
                    <div class="llm-analysis" style="margin-top: 15px; background: rgba(233, 69, 96, 0.1); border-color: rgba(233, 69, 96, 0.3);">
                        <div class="analysis-title" style="color: #e94560;">💡 توصیه</div>
                        <div class="analysis-content">${analysis.recommendation}</div>
                    </div>
                    <div style="margin-top: 20px; display: flex; gap: 20px; align-items: center;">
                        <div>
                            <span style="color: #a0a0a0;">اعتماد به نفس:</span>
                            <strong style="color: #00d9ff;">${(analysis.confidence * 100).toFixed(0)}%</strong>
                        </div>
                        <span class="risk-badge ${riskClass}">سطح ریسک: ${riskLabels[analysis.risk_level]}</span>
                    </div>
                    <div style="margin-top: 15px; font-size: 0.8rem; color: #666;">
                        زمان تحلیل: ${new Date(analysis.timestamp).toLocaleString('fa-IR')}
                    </div>
                `;
                
            } catch (error) {
                content.innerHTML = '<p style="color: #ff4444;">خطا در دریافت تحلیل</p>';
            }
        }
        
        async function triggerLog(capability) {
            const statuses = ['success', 'warning', 'error'];
            const messages = {
                'success': ['اجرا موفق', 'عملکرد نرمال', 'بروزرسانی انجام شد'],
                'warning': ['تاخیر در اجرا', 'منابع نزدیک به حد مجاز', 'نیاز به بررسی'],
                'error': ['خطا در اجرا', 'شکست عملیات', 'نیاز به مداخله فوری']
            };
            
            const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
            const randomMessage = messages[randomStatus][Math.floor(Math.random() * messages[randomStatus].length)];
            
            try {
                await fetch(`${API_BASE}/capability/${capability}/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_type: randomStatus,
                        message: randomMessage,
                        details: { test: true, timestamp: new Date().toISOString() }
                    })
                });
                
                showToast(`لاگ تست با وضعیت "${randomStatus}" ثبت شد`, 'info');
                loadDashboard();
                
            } catch (error) {
                showToast('خطا در ثبت لاگ: ' + error.message, 'error');
            }
        }
        
        function getCapabilityCategory(capability) {
            for (const [category, caps] of Object.entries({
                core_trading: ['algorithmic_crypto_trading', 'multi_exchange_support', 'market_data_fetching', 'multi_timeframe_analysis', 'technical_strategies', 'market_regime_detection', 'ensemble_strategies', 'portfolio_optimization'],
                risk_management: ['risk_management', 'position_sizing', 'stop_loss_take_profit', 'trailing_stop', 'breakeven_stop', 'partial_take_profit', 'max_positions_exposure', 'circuit_breaker', 'kill_switch', 'live_safety_engine'],
                order_management: ['order_manager', 'idempotency', 'fill_manager', 'position_manager', 'exchange_reconciliation', 'crash_recovery', 'persistence_database'],
                backtesting_quant: ['walk_forward_backtesting', 'out_of_sample_testing', 'transaction_cost_modeling', 'slippage_modeling', 'no_trade_zone', 'benchmarking', 'ensemble_backtesting', 'performance_metrics', 'regime_based_analysis', 'monte_carlo_robustness'],
                ai_ml: ['ml_pipeline', 'feature_engineering', 'causal_feature_engineering', 'purged_walk_forward_validation', 'ml_prediction', 'model_registry', 'model_versioning', 'model_drift_monitoring', 'ml_strategy_integration'],
                ai_sentiment: ['sentiment_analysis', 'news_context_analysis', 'llm_integration', 'sentiment_as_signal'],
                infrastructure: ['fastapi', 'trading_api', 'health_status_monitoring', 'logging', 'observability', 'configuration_management', 'sqlite_postgresql', 'docker_deployment', 'ci_cd_support', 'paper_trading', 'shadow_trading', 'live_trading_architecture']
            })) {
                if (caps.includes(capability)) return category;
            }
            return 'unknown';
        }
        
        function closeModal() {
            document.getElementById('logs-modal').classList.remove('active');
        }
        
        // Close modal on outside click
        document.getElementById('logs-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Simulate activity for random capabilities
        async function simulateActivity() {
            const allCapabilities = Object.values(capabilityNames).length;
            const randomCount = Math.floor(Math.random() * 5) + 3; // 3-7 capabilities
            let successCount = 0;
            
            for (let i = 0; i < randomCount; i++) {
                const capKeys = Object.keys(capabilityNames);
                const randomCap = capKeys[Math.floor(Math.random() * capKeys.length)];
                await triggerLog(randomCap);
                successCount++;
            }
            
            showToast(`✅ فعالیت برای ${successCount} قابلیت شبیه‌سازی شد`, 'success');
            loadDashboard();
        }

        // Copy all logs and LLM analysis - robust, instant, and handles iframe clipboard restrictions cleanly
        async function copyAllLogsAndAnalysis() {
            showToast('در حال آماده‌سازی گزارش جامع...', 'info', 2000);
            let reportText = '';
            
            try {
                const response = await fetch(`${API_BASE}/v1/capabilities/full-report`);
                if (response.ok) {
                    const data = await response.json();
                    reportText = data.report_text || '';
                }
            } catch (err) {
                console.warn('Full report API failed, falling back to local summary:', err);
            }

            if (!reportText) {
                reportText = generateFallbackReportText();
            }

            let copiedSuccessfully = false;
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(reportText);
                    copiedSuccessfully = true;
                    showToast('✅ تمام لاگ‌ها و تحلیل‌ها با موفقیت در کلیپ‌بورد کپی شدند!', 'success');
                } catch (clipError) {
                    console.warn('Clipboard writeText failed (iframe focus or permission):', clipError);
                }
            }

            // If clipboard write was blocked by browser iframe focus/permission policy:
            if (!copiedSuccessfully) {
                openReportModal(reportText);
            }
        }

        function generateFallbackReportText() {
            let text = "=== گزارش قابلیت‌های سیستم معاملات الگوریتمی ===\n";
            text += `تاریخ: ${new Date().toLocaleString('fa-IR')}\nتعداد کل قابلیت‌ها: 60\n\n`;
            for (const [id, name] of Object.entries(capabilityNames)) {
                text += `[${name}] (${id}): وضعیت فعال و تحت نظارت سیستم\n`;
            }
            return text;
        }

        function openReportModal(reportText) {
            const modal = document.getElementById('logs-modal');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');
            
            title.textContent = '📋 گزارش جامع لاگ‌ها و تحلیل‌های سیستم';
            content.innerHTML = `
                <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                    <button onclick="copyFromModalTextarea()" style="background: #00d9ff; color: #0f172a; border: none; padding: 9px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                        📋 کپی مجدد متن
                    </button>
                    <a href="${API_BASE}/v1/capabilities/export-text" download="trading_system_report.txt" style="background: #10b981; color: #fff; text-decoration: none; padding: 9px 20px; border-radius: 6px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px;">
                        💾 دانلود مستقیم فایل متنی (.txt)
                    </a>
                    <span style="color: #94a3b8; font-size: 0.85rem;">
                        (به دلیل سیاست امنیتی فریم مرورگر، متن در کادر زیر انتخاب شده است)
                    </span>
                </div>
                <textarea id="report-modal-textarea" readonly style="width: 100%; height: 350px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.85rem; direction: ltr; text-align: left; resize: vertical; line-height: 1.5;"></textarea>
            `;
            
            const textarea = document.getElementById('report-modal-textarea');
            textarea.value = reportText;
            modal.classList.add('active');
            
            setTimeout(() => {
                textarea.focus();
                textarea.select();
                try {
                    const ok = document.execCommand('copy');
                    if (ok) {
                        showToast('✅ متن با موفقیت کپی شد!', 'success');
                    } else {
                        showToast('متن انتخاب شد (با Ctrl+C کپی کنید)', 'info');
                    }
                } catch (e) {
                    showToast('متن انتخاب شد (با Ctrl+C کپی کنید)', 'info');
                }
            }, 150);
        }

        function copyFromModalTextarea() {
            const textarea = document.getElementById('report-modal-textarea');
            if (!textarea) return;
            textarea.focus();
            textarea.select();
            try {
                const ok = document.execCommand('copy');
                if (ok) {
                    showToast('✅ گزارش با موفقیت کپی شد!', 'success');
                } else {
                    showToast('متن انتخاب شد؛ با کلیدهای Ctrl+C کپی کنید.', 'info');
                }
            } catch (e) {
                showToast('لطفاً با استفاده از کلیدهای Ctrl+C کپی کنید.', 'info');
            }
        }
        
        // Initial load
        loadDashboard();
        
        // Auto refresh every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
