<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد ربات معاملاتی کریپتو</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-primary: #f1f5f9; --text-secondary: #94a3b8; --accent: #3b82f6; --success: #10b981; --warning: #f59e0b; --error: #ef4444; --border: #334155; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-primary); margin: 0; padding: 20px; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        h1 { margin: 0; font-size: 2rem; color: var(--accent); }
        .subtitle { color: var(--text-secondary); margin-top: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .stat-value { font-size: 2rem; font-weight: bold; color: var(--accent); }
        .stat-label { color: var(--text-secondary); font-size: 0.9rem; }
        .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1rem; font-family: inherit; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        button.copy-btn { background: var(--success); }
        button.copy-btn:hover { box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .category-section { margin-bottom: 40px; }
        .category-title { font-size: 1.5rem; color: var(--text-secondary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .capabilities-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .cap-card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border); transition: transform 0.2s; }
        .cap-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .cap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cap-icon { font-size: 1.5rem; }
        .cap-name { font-weight: 600; font-size: 1.1rem; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .status-active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-error { background: rgba(239, 68, 68, 0.2); color: var(--error); }
        .log-area { margin-top: 15px; background: #0f172a; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: var(--text-secondary); max-height: 150px; overflow-y: auto; border: 1px solid var(--border); }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        .log-time { color: var(--accent); font-size: 0.75rem; }
        .llm-analysis { margin-top: 8px; padding: 8px; background: rgba(59, 130, 246, 0.1); border-right: 3px solid var(--accent); font-size: 0.85rem; color: #cbd5e1; }
        .logs-container { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-top: 40px; border: 1px solid var(--border); }
        .log-list { font-family: monospace; font-size: 0.9rem; color: var(--text-secondary); max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 داشبورد ربات معاملاتی کریپتو</h1>
            <div class="subtitle">نظارت بر ۶۰ قابلیت با لاگ‌گذاری هوشمند و تحلیل LLM</div>
        </header>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="uptime">-</div><div class="stat-label">زمان کارکرد</div></div>
            <div class="stat-card"><div class="stat-value" id="cycle-count">0</div><div class="stat-label">تعداد سیکل‌ها</div></div>
            <div class="stat-card"><div class="stat-value" id="active-logs">0</div><div class="stat-label">لاگ‌های فعال</div></div>
            <div class="stat-card"><div class="stat-value" id="total-caps">60</div><div class="stat-label">کل قابلیت‌ها</div></div>
        </div>
        <div class="controls">
            <button onclick="fetchData()">🔄 بروزرسانی</button>
            <button onclick="simulateActivity()">🎲 شبیه‌سازی فعالیت</button>
            <button class="copy-btn" onclick="copyAllLogsAndAnalysis()">📋 کپی تمام لاگ‌ها و تحلیل‌های LLM</button>
        </div>
        <div id="capabilities-container"><div style="text-align:center; padding: 40px;">در حال بارگذاری...</div></div>
        <div class="logs-container"><h3>📝 لاگ‌های عمومی سیستم</h3><div class="log-list" id="system-logs"></div></div>
    </div>
    <script>
        const API_BASE = window.location.origin;
        async function fetchData() {
            try {
                const response = await fetch(`${API_BASE}/api/data`);
                const data = await response.json();
                document.getElementById('uptime').innerText = data.uptime;
                document.getElementById('cycle-count').innerText = data.cycle_count;
                document.getElementById('active-logs').innerText = data.active_logs;
                renderCapabilities(data.capabilities_status, data.capabilities_structure);
                renderSystemLogs(data.system_logs);
            } catch (error) { console.error('Error fetching data:', error); }
        }
        function renderCapabilities(capabilitiesStatus, capabilitiesStructure) {
            const container = document.getElementById('capabilities-container');
            if (!capabilitiesStatus || Object.keys(capabilitiesStatus).length === 0) return;
            const categories = {};
            for (const [capId, capData] of Object.entries(capabilitiesStatus)) {
                const capInfo = capabilitiesStructure[capId] || {name: capId, icon: '📦', category: 'unknown'};
                if (!categories[capInfo.category]) categories[capInfo.category] = [];
                categories[capInfo.category].push({
                    id: capId,
                    name: capInfo.name,
                    icon: capInfo.icon,
                    category: capInfo.category,
                    status: capData.status,
                    status_text: capData.status === 'active' ? 'فعال' : capData.status === 'warning' ? 'هشدار' : 'خطا',
                    logs: capData.logs || []
                });
            }
            let html = '';
            for (const [catName, caps] of Object.entries(categories)) {
                const catDisplayName = capabilitiesStructure[Object.keys(caps)[0]]?.category || catName;
                html += `<div class="category-section"><div class="category-title">📦 ${catDisplayName}</div><div class="capabilities-grid">`;
                caps.forEach(cap => {
                    let statusClass = 'status-active';
                    if (cap.status === 'warning') statusClass = 'status-warning';
                    if (cap.status === 'error') statusClass = 'status-error';
                    let logsHtml = '';
                    if (cap.logs && cap.logs.length > 0) {
                        logsHtml = '<div class="log-area">';
                        cap.logs.slice(-5).reverse().forEach(log => {
                            logsHtml += `<div class="log-entry"><div class="log-time">${log.timestamp}</div><div>${log.message}</div>`;
                            if (log.llm_analysis) logsHtml += `<div class="llm-analysis">🤖 تحلیل LLM: ${log.llm_analysis}</div>`;
                            logsHtml += `</div>`;
                        });
                        logsHtml += '</div>';
                    }
                    html += `<div class="cap-card"><div class="cap-header"><span class="cap-icon">${cap.icon}</span><span class="cap-name">${cap.name}</span><span class="status-badge ${statusClass}">${cap.status_text}</span></div>${logsHtml}</div>`;
                });
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }
        function renderSystemLogs(logs) {
            const container = document.getElementById('system-logs');
            if (!logs || logs.length === 0) { container.innerHTML = '<div>هیچ لاگ سیستمی موجود نیست.</div>'; return; }
            container.innerHTML = logs.slice(-20).reverse().map(log => `<div>${log}</div>`).join('');
        }
        async function simulateActivity() {
            try {
                const btn = event.target; btn.disabled = true; btn.innerText = '⏳ در حال پردازش...';
                await fetch(`${API_BASE}/api/simulate`, { method: 'POST' });
                setTimeout(() => { fetchData(); btn.disabled = false; btn.innerText = '🎲 شبیه‌سازی فعالیت'; }, 1000);
            } catch (error) { alert('خطا در شبیه‌سازی فعالیت'); btn.disabled = false; btn.innerText = '🎲 شبیه‌سازی فعالیت'; }
        }
        async function copyAllLogsAndAnalysis() {
            try {
                const response = await fetch(`${API_BASE}/api/data`);
                const data = await response.json();
                let clipboardText = "📊 گزارش کامل لاگ‌ها و تحلیل‌های LLM\n";
                clipboardText += `تاریخ گزارش: ${new Date().toLocaleString('fa-IR')}\n================================================\n\n`;
                
                // افزودن ارزیابی‌های دسته‌بندی
                if (data.category_evaluations) {
                    clipboardText += "📋 ارزیابی‌های LLM برای هر دسته‌بندی:\n";
                    clipboardText += "================================================\n";
                    for (const [catKey, evaluation] of Object.entries(data.category_evaluations)) {
                        const catName = data.capabilities_structure[catKey]?.name || catKey;
                        clipboardText += `\n📂 دسته‌بندی: ${catName}\n`;
                        clipboardText += "------------------------------------------------\n";
                        if (evaluation) {
                            clipboardText += `   وضعیت: ${evaluation.status || 'نامشخص'}\n`;
                            clipboardText += `   تحلیل: ${evaluation.analysis || evaluation.llm_evaluation || 'تحلیلی موجود نیست'}\n`;
                            if (evaluation.issues) clipboardText += `   مشکلات: ${JSON.stringify(evaluation.issues)}\n`;
                            if (evaluation.recommendations) clipboardText += `   پیشنهادات: ${JSON.stringify(evaluation.recommendations)}\n`;
                        } else {
                            clipboardText += "   ⚠️ هیچ ارزیابی برای این دسته‌بندی موجود نیست\n";
                        }
                        clipboardText += "\n";
                    }
                }
                
                // افزودن لاگ‌های هر قابلیت
                const categories = {};
                data.capabilities.forEach(cap => { if (!categories[cap.category]) categories[cap.category] = []; categories[cap.category].push(cap); });
                for (const [catName, caps] of Object.entries(categories)) {
                    clipboardText += `📂 دسته‌بندی: ${catName}\n------------------------------------------------\n`;
                    caps.forEach(cap => {
                        if (cap.logs && cap.logs.length > 0) {
                            clipboardText += `\n🔹 قابلیت: ${cap.name} (${cap.icon})\n   وضعیت فعلی: ${cap.status_text}\n`;
                            cap.logs.forEach(log => {
                                clipboardText += `   └─ [${log.timestamp}] ${log.message}\n`;
                                if (log.llm_analysis) clipboardText += `      🤖 تحلیل LLM: ${log.llm_analysis}\n`;
                            });
                        }
                    });
                    clipboardText += "\n";
                }
                navigator.clipboard.writeText(clipboardText).then(() => { alert('✅ تمام لاگ‌ها، تحلیل‌های LLM و ارزیابی‌های دسته‌بندی با موفقیت کپی شدند!'); }).catch(err => { console.error('خطا در کپی:', err); alert('❌ خطا در کپی کردن متن.'); });
            } catch (error) { console.error('خطا در دریافت داده‌ها:', error); alert('❌ خطا در دریافت داده‌ها برای کپی.'); }
        }
        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
