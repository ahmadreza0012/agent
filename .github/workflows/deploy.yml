name: Deploy to EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            
            echo "========================================="
            echo "🚀 Starting deployment to EC2..."
            echo "========================================="
            
            # Navigate to home directory
            cd ~
            
            # Get the username dynamically
            CURRENT_USER=$(whoami)
            AGENT_DIR="/home/$CURRENT_USER/agent"

            # Install git, nodejs, screen if not available
            echo "🔧 Installing system dependencies..."
            if command -v dnf &> /dev/null; then
              sudo dnf install -y git python3-pip nodejs npm screen tmux 2>/dev/null || true
            elif command -v yum &> /dev/null; then
              sudo yum install -y git python3-pip nodejs npm screen tmux 2>/dev/null || true
            fi

            # Check if agent directory exists
            if [ -d "agent" ]; then
              echo "📁 Agent directory exists. Updating..."
              cd agent
              git fetch --all
              git checkout main 2>/dev/null || git checkout -b main
              git reset --hard origin/main
            else
              echo "📁 Cloning agent repository..."
              git clone --branch main https://github.com/ahmadreza0012/agent.git
              cd agent
              AGENT_DIR="$(pwd)"
            fi

            # Install Python dependencies safely
            echo "📦 Installing Python dependencies..."
            if [ -f requirements.txt ]; then
              pip3 install -r requirements.txt --user || pip3 install -r requirements.txt || true
            else
              pip3 install flask flask-cors requests --user || true
            fi

            # Install Node.js dependencies for the dashboard and engine
            echo "📦 Installing Node.js dependencies..."
            if command -v npm &> /dev/null; then
              npm install --omit=dev || npm install || true
            fi

            # Create .env file if it doesn't exist
            if [ ! -f .env ]; then
              echo "📝 Creating .env file from example..."
              cp .env.example .env 2>/dev/null || touch .env
              echo "⚠️ IMPORTANT: Please update .env file with your API keys!"
            fi

            # Stop existing processes
            echo "🛑 Stopping existing processes (if running)..."
            screen -S bot -X quit 2>/dev/null || true
            pkill -f "python.*main.py" || true
            pkill -f "python.*web_api.py" || true
            pkill -f "node.*server.js" || true

            # Start the Node.js trading engine and dashboard on port 3000
            echo "🚀 Starting Node.js Trading Engine on port 3000..."
            nohup node server.js > server.log 2>&1 &
            echo $! > .server.pid
            sleep 2

            # Start the bot in a screen session (or nohup fallback)
            echo "🚀 Starting bot in screen session..."
            if command -v screen &> /dev/null; then
              screen -S bot -dm bash -c "cd $AGENT_DIR && python3 main.py"
            else
              nohup python3 main.py > bot.log 2>&1 &
              echo $! > .bot.pid
            fi

            # Start Web API for monitoring and control on port 5000
            echo "🌐 Starting Web API for monitoring on port 5000..."
            cd $AGENT_DIR
            pip3 install flask flask-cors --user --quiet 2>/dev/null || true

            nohup python3 web_api.py > web_api.log 2>&1 &
            echo $! > .web_api.pid
            sleep 2

            if ps -p $(cat .web_api.pid) > /dev/null 2>&1; then
              echo "✅ Web API started successfully on port 5000"
            else
              echo "⚠️ Web API status check, checking web_api.log"
            fi

            echo "========================================="
            echo "✅ Deployment completed successfully!"
            echo "========================================="
            echo ""
            echo "📊 Bot Status:"
            screen -ls
            echo ""
            echo "📝 To view bot logs:"
            echo "   ssh -i ~/.ssh/ec2_key.pem \${{ secrets.EC2_USER }}@\${{ secrets.EC2_HOST }}"
            echo "   screen -r bot"
            echo ""
            echo "📝 To detach from screen: Ctrl+A, then D"
          EOF

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            CURRENT_USER=$(whoami)
            AGENT_DIR="/home/$CURRENT_USER/agent"
            cd $AGENT_DIR
            if [ -f main.py ]; then
              echo "✅ main.py found"
              echo "✅ Project files: $(ls -la | wc -l) files"
            else
              echo "❌ Verification failed - main.py not found"
              exit 1
            fi
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem
          echo "🧹 Cleanup completed"
