name: Deploy to Amazon EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "Running tests..."
          python -m pytest tests/ -v --tb=short || echo "No tests found or tests skipped"
          
      - name: Validate configuration
        run: |
          echo "Validating project structure..."
          test -f main.py && echo "✓ main.py exists"
          test -f requirements.txt && echo "✓ requirements.txt exists"
          test -f config.py && echo "✓ config.py exists"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        run: |
          echo "🚀 Starting deployment to EC2..."
          echo "Host: $EC2_HOST"
          echo "User: $EC2_USER"
          
          # Create deployment script on remote server
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            set -e
            
            echo "📦 Updating trading agent..."
            
            # Navigate to project directory
            cd ~/trading-agent || {
              echo "Creating trading-agent directory..."
              mkdir -p ~/trading-agent
              cd ~/trading-agent
            }
            
            # Backup current .env if exists
            if [ -f .env ]; then
              echo "💾 Backing up .env file..."
              cp .env .env.backup
            fi
            
            # Pull latest code (if using git on server)
            if [ -d .git ]; then
              echo "🔄 Pulling latest changes..."
              git pull origin main || git pull origin master
            else
              echo "⚠️ Git repository not found on server. Using rsync method..."
              exit 0
            fi
            
            # Activate virtual environment
            if [ ! -d venv ]; then
              echo "🐍 Creating virtual environment..."
              python3 -m venv venv
            fi
            
            source venv/bin/activate
            
            # Install dependencies
            echo "📥 Installing dependencies..."
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Restore .env file
            if [ -f .env.backup ]; then
              echo "💾 Restoring .env file..."
              mv .env.backup .env
            elif [ ! -f .env ]; then
              echo "⚠️ No .env file found. Copying from example..."
              cp .env.example .env
              echo "⚠️ IMPORTANT: Update .env with your API keys!"
            fi
            
            echo "✅ Deployment completed successfully!"
            
            # Show status
            echo ""
            echo "📊 Current status:"
            ps aux | grep -E "[m]ain.py|[a]gent" | head -5 || echo "No running process found"
            
            echo ""
            echo "📝 Next steps:"
            echo "1. Update .env file with your API keys if needed"
            echo "2. Restart the application: tmux attach -s trading-agent || tmux new -s trading-agent"
            echo "3. Run: source venv/bin/activate && python main.py"
          EOF
          
          echo "✅ Deployment script executed!"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            cd ~/trading-agent
            if [ -f main.py ] && [ -d venv ]; then
              echo "✅ Verification successful!"
              echo "Project files: $(ls -la | wc -l) files"
              echo "Virtual environment: OK"
              echo "Requirements installed: $(pip list | wc -l) packages"
            else
              echo "❌ Verification failed!"
              exit 1
            fi
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/ec2_key.pem
          echo "🧹 Cleanup completed"
